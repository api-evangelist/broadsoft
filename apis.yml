name: Broadsoft
description: BroadSoft was a cloud unified-communications (UCaaS) and VoIP software provider whose BroadWorks and
  BroadCloud platforms powered hosted PBX, calling, messaging, and contact-center services for telecom carriers
  and service providers worldwide. Its developer surface centered on the Xtended Services Interface (XSI) and OCI
  (Open Client Interface) provisioning APIs. Cisco acquired BroadSoft in February 2018 and folded the products into
  its Collaboration portfolio; the platform now ships as Cisco BroadWorks. The independent developer presence has
  been retired — www.broadsoft.com 301-redirects to cisco.com — so this profile carries no standalone live API surface.
  Originally surfaced as a bessemer-venture-partners portfolio company and added to the API Evangelist network for
  enrichment.
